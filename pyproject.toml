[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgraph"
version = "1.0.0"
description = "A Solidity repo as a portable, queryable attack-path graph on Relate (Neo4j embedded graph DB)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Runtime deps: stdlib + relate-db only. Slither is an external tool
# prerequisite for ingest (see README), not a Python dependency:
# ingest.py imports it lazily and fails with a clear error if absent.
dependencies = ["relate-db>=1.1.0"]

[tool.setuptools.packages.find]
include = ["auditgraph*"]
